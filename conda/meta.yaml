# do not edit the following line. It will be updated automatically
#{% set data = load_setup_py_data() %}
{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}

package:
  name: pyqglviewer
  version: {{ version }}

source:
  path: ..

about:
  home: https://github.com/openalea/PyQGLViewer
  license: GPL
  summary: PyQGLViewer is a set of Python bindings for the libQGLViewer C++ library which extends the Qt framework with widgets and tools that eases the creation of OpenGL 3D viewers.

build:
  number: 2
  string: py{{ PY_VER }}
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION
  # script:
  #   - sip-install --verbose
    # - {{ PYTHON }} -m pip install . -v --no-build-isolation --no-deps --ignore-installed

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}                    # [osx and win]
    - make                               # [unix]
    - pkg-config                         # [unix]
    # - libgl-devel                        # [linux]  # match libqglviewer CDT GL strategy
    # # from https://conda-forge.org/docs/maintainer/knowledge_base.html#libgl
    # - python
    # - sip           
    # - pyqt
    # - pyqt-builder                    
  host:
    - python
    - pip
    - sip<=6.10
    - pyqt
    - pyqt5-sip
    - pyqt-builder=1.18
    - packaging
    - qt-main
    - libqglviewer
    - libgl-devel                        # [linux]
    - libxcb                             # [linux]
    - pthread-stubs                      # [linux]
    - sysroot_linux-64                   # [linux]
    - xorg-libxfixes                     # [linux]


  run:
    - python
    - sip<=6.10
    - pyqt
    - libqglviewer
    - pyopengl
    - xorg-libxfixes  # [linux]

test:
  requires:       # [unix]
    - pytest      # [unix]
    - pytest-qt   # [unix]
    - pytest-xvfb # [unix]
  imports:
    - PyQGLViewer
  source_files:   # [unix]
    - test/*.py   # [unix]
  commands:       # [unix]
    - pytest -v   # [unix]
