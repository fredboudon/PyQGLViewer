# do not edit the following line. It will be updated automatically
#{% set data = load_setup_py_data() %}
{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}

package:
  name: pyqglviewer
  version: {{ version }}

source:
  path: ..

about:
  home: https://github.com/openalea/PyQGLViewer
  license: GPL
  summary: PyQGLViewer is a set of Python bindings for the libQGLViewer C++ library which extends the Qt framework with widgets and tools that eases the creation of OpenGL 3D viewers.

build:
  number: 2
  script:
    - readlink -f "$(which g++)"         # [linux]
    - g++ --version                      # [linux]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    # on linux qmake calls g++ by its plain name, that compiler('cxx') does not provide
    - gxx                                # [linux]
    - make                               # [unix]
    - pkg-config                         # [unix]                 
  host:
    - python
    - pip
    - sip<=6.10
    - pyqt
    - pyqt5-sip
    - pyqt-builder 1.18.*
    - packaging
    - qt-main
    - libqglviewer
    - libgl-devel                        # [linux]
    - xorg-libxfixes                     # [linux]

  run:
    - python
    - pyqt
    - libqglviewer
    - pyopengl
    - xorg-libxfixes  # [linux]

test:
  requires:
    - pytest
    - pytest-qt
    - pytest-xvfb # [linux]
  imports:
    - PyQGLViewer
  source_files:
    - test/*.py
  commands:
    - set QT_QPA_PLATFORM=offscreen # [win]
    - pytest -v
