 # Specify the build system.
[build-system]
# "setuptools", "setuptools-scm" not used
# Not installed nor checked by pip with --no-build-isolation: the versions that work
# (sip<=6.10, PyQt-builder 1.18.*) are pinned in conda/meta.yaml
requires = ["sip", "PyQt-builder"]
build-backend = "sipbuild.api"


# Specify the PEP 566 metadata for the project.
[project]
name = "PyQGLViewer"
# Version placeholder. Dynamic version set in project.py
version = "1.3.3.dev"
description = "Python bindings of libQGLViewer."
readme = "README.md"
authors = [
    { name = "Frederic Boudon", email = "frederic.boudon@cirad.fr" }
]
dependencies = [
    "PyQt5",
    "PyQt5-sip"
]

[tool.sip.project]
sip-module = "PyQt5.sip"
sip-files-dir = "sip"

[tool.sip.bindings.PyQGLViewer]
qmake-QT = ['xml', 'opengl', 'gui', 'widgets']
tags = ['QGLViewer_2_9_1']
# Markers must follow the name without space ('name;marker'): sip keeps spaces in the
# value. Include and library dirs of the conda env are added in project.py.
libraries = [
    'QGLViewer;sys_platform != "win32"',
    'GLU;sys_platform == "linux"',
    'QGLViewer2;sys_platform == "win32"',
    'opengl32;sys_platform == "win32"',
    'glu32;sys_platform == "win32"',
]
